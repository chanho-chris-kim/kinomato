name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The production build as Workers Builds runs it: no DATABASE_URL at
      # build time (it's a runtime Worker secret only). A page that reaches
      # the database during `next build` prerendering fails here, before
      # merge, instead of failing main's deploy. The E2E job's build can't
      # catch this: it has a database URL. Unset explicitly, not just
      # absent, so a secret added to this job later can't hide it.
      - name: Production build (no database, as Workers Builds)
        run: env -u DATABASE_URL -u E2E_DATABASE_URL npx opennextjs-cloudflare build

      # The Workers free plan caps a Worker at 3 MiB gzipped. Fail at 2.6
      # MiB, well before it, and print the size every run so growth is
      # visible. A generated invite image (next/og) alone measured +823 KiB.
      - name: Worker bundle size (fails over 2.6 MiB gzipped)
        run: |
          out=$(env -u DATABASE_URL -u E2E_DATABASE_URL npx wrangler deploy --dry-run 2>&1) || { echo "$out"; exit 1; }
          size=$(echo "$out" | grep -oE 'gzip: [0-9.]+ (KiB|MiB)' | head -1)
          if [ -z "$size" ]; then echo "$out"; echo "::error::Couldn't read the gzipped size from wrangler's output"; exit 1; fi
          kib=$(echo "$size" | awk '{ print ($3 == "MiB") ? $2 * 1024 : $2 }')
          echo "Worker bundle: ${kib} KiB gzipped (fails over 2662.4 KiB = 2.6 MiB; plan limit 3 MiB)"
          awk -v k="$kib" 'BEGIN { exit !(k <= 2662.4) }' || { echo "::error::Worker bundle is ${kib} KiB gzipped, over 2.6 MiB"; exit 1; }

  # Separate job on purpose: a flaky or slow E2E run must never block a
  # logic fix that only touched lib/. Don't add this job to main's
  # required status checks in GitHub branch protection — only Check.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Every run resets the schema of CI's own E2E Neon branch (the
    # E2E_DATABASE_URL secret), pushes this commit's schema and reseeds it
    # (e2e/global-setup.ts). All CI runs share that branch, so queue
    # rather than cancel-in-progress: two pushes in quick succession must
    # never have their resets overlap mid-run. Developers' local runs use
    # their own branch (.env.example), which this group can't see.
    concurrency:
      group: e2e-ci-neon-branch
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # E2E runs against `next build && next start` in CI
      # (playwright.config.ts). Reusing the build cache keeps the build
      # step incremental between runs.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'lib/**', 'db/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      # Playwright's trace files (retain-on-failure) live inside this
      # report — download it from the failed run's Summary page for a
      # full timeline: DOM snapshots, network, console.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
