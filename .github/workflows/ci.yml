name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Separate job on purpose: a flaky or slow E2E run must never block a
  # logic fix that only touched lib/. Don't add this job to main's
  # required status checks in GitHub branch protection — only Check.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Every run resets the schema of CI's own E2E Neon branch (the
    # E2E_DATABASE_URL secret), pushes this commit's schema and reseeds it
    # (e2e/global-setup.ts). All CI runs share that branch, so queue
    # rather than cancel-in-progress: two pushes in quick succession must
    # never have their resets overlap mid-run. Developers' local runs use
    # their own branch (.env.example), which this group can't see.
    concurrency:
      group: e2e-ci-neon-branch
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # E2E runs against `next build && next start` in CI
      # (playwright.config.ts). Reusing the build cache keeps the build
      # step incremental between runs.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'lib/**', 'db/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      # Playwright's trace files (retain-on-failure) live inside this
      # report — download it from the failed run's Summary page for a
      # full timeline: DOM snapshots, network, console.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
